name: Build-VidPlayer-APK

# 触发条件：推送到 main/master 分支自动编译；也可在 Actions 页面手动 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 首次要编译 FFmpeg，预留 6 小时上限

    steps:
      # 1. 拉取仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. Python 3.10（buildozer 宿主环境，与手机内 Python 无关）
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # 3. 缓存 Android SDK/NDK 与 p4a 构建产物，第二次构建会快很多
      - name: 缓存 buildozer 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 4. 系统依赖（python-for-android / FFmpeg 编译需要）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-venv \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libstdc++6 libffi-dev libssl-dev \
            build-essential ccache cmake wget xz-utils ca-certificates

      # 5. 打包前先做 Python 语法自检，代码有语法错误时 2 秒内失败，不用等编译
      - name: 代码语法自检
        run: |
          python -m py_compile main.py vidcore.py vidutil.py
          echo "语法自检通过"
          test -f fonts/ZCOOLKuaiLe-Regular.ttf && echo "字体文件在位"
          test -f buildozer.spec && echo "buildozer.spec 在位"

      # 6. 在独立虚拟环境中安装 buildozer（避免与系统包冲突导致安装失败）
      - name: 安装 buildozer 与 Cython
        run: |
          python -m venv $HOME/venv
          source $HOME/venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          # 固定 Cython 0.29.36：python-for-android 2024.01 的配方需要 0.29.x
          pip install --retries 5 --timeout 60 \
            "Cython==0.29.36" "buildozer==1.5.0" virtualenv \
            || pip install --retries 5 --timeout 60 \
            "Cython==0.29.36" buildozer virtualenv
          python -m pip list
          buildozer version

      # 7. 预下载 freetype 源码：savannah.gnu.org 经常 502，提前用多个镜像兜底
      #    p4a 发现包已存在会跳过下载（双架构合并构建目录名固定）
      - name: 预下载 freetype 源码（镜像兜底）
        run: |
          set -e
          FT_DIR=".buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          mkdir -p "$FT_DIR"
          F="freetype-2.10.1.tar.gz"
          URLS=(
            "https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/$F"
            "https://mirrors.ocf.berkeley.edu/nongnu/freetype/$F"
            "https://mirror.csclub.uwaterloo.ca/nongnu/freetype/$F"
            "https://download.savannah.gnu.org/releases/freetype/$F"
          )
          for u in "${URLS[@]}"; do
            echo "==> 尝试 $u"
            if curl -fL --retry 3 --connect-timeout 20 -o "$FT_DIR/$F.tmp" "$u"; then
              if gzip -t "$FT_DIR/$F.tmp" 2>/dev/null; then
                mv "$FT_DIR/$F.tmp" "$FT_DIR/$F"
                echo "==> freetype 预下载成功"; ls -lh "$FT_DIR/$F"; exit 0
              fi
            fi
            rm -f "$FT_DIR/$F.tmp"
          done
          echo "==> 预下载未成功也不退出，交给 buildozer 自行重试下载"

      # 8. 正式打包 APK（首次约 30~90 分钟，需下载 SDK/NDK 并编译 FFmpeg）
      #    最多自动重试 3 轮，已下载的内容有缓存，重试不会从零开始
      - name: 打包 APK
        run: |
          source $HOME/venv/bin/activate
          export BUILDOZER_WARN_ON_ROOT=1
          for i in 1 2 3; do
            echo "=========== 第 $i 次构建尝试 ==========="
            if yes | buildozer -v android debug; then
              echo "=========== 构建成功 ==========="; exit 0
            fi
            echo "第 $i 次未成功，15 秒后利用缓存重试..."
            sleep 15
          done
          echo "三次构建均失败"; exit 1

      # 8. 上传 APK，构建成功后在该运行页面的 Artifacts 处下载
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: VidPlayer-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      # 9. 失败时自动打印关键日志，方便定位
      - name: 失败时输出关键日志
        if: failure()
        run: |
          echo "================ buildozer.spec ================"
          cat buildozer.spec
          echo "================ build.log 尾部 ================"
          for f in \
            .buildozer/android/platform/build.log \
            ~/.buildozer/android/platform/python-for-android/build.log \
            ~/.buildozer/android/platform/*/dists/*/build.log \
            ; do
            if [ -f "$f" ]; then echo "---- $f ----"; tail -n 120 "$f"; fi
          done
          echo "================ 全部 .log 文件 ================"
          find .buildozer ~/.buildozer -type f -name "*.log" 2>/dev/null | head -n 50
